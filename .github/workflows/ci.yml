name: CI

on: [push, pull_request]

jobs:
  build:
    runs-on: macos-latest
    steps:
    - uses: actions/checkout@v4
    - name: Select an available iPhone simulator
      id: simulator
      run: |
        simulator_id=$(xcrun simctl list devices available -j | python3 -c 'import json, sys; data = json.load(sys.stdin); print(next(device["udid"] for devices in data["devices"].values() for device in devices if device["name"].startswith("iPhone")))')
        echo "id=$simulator_id" >> "$GITHUB_OUTPUT"
    - name: Test public package API
      run: >-
        xcodebuild test
        -workspace .swiftpm/xcode/package.xcworkspace
        -scheme Beeline
        -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
        -parallel-testing-enabled NO
        IPHONEOS_DEPLOYMENT_TARGET=16.1
        CODE_SIGNING_ALLOWED=NO
    - name: Test example project
      run: >-
        xcodebuild test
        -project Beeline.xcodeproj
        -scheme BeelineExample
        -destination 'platform=iOS Simulator,id=${{ steps.simulator.outputs.id }}'
        -parallel-testing-enabled NO
        IPHONEOS_DEPLOYMENT_TARGET=16.1
        CODE_SIGNING_ALLOWED=NO
